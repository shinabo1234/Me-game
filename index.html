<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sonic CD Plus Plus JP</title>

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #111;
        font-family: Arial, Helvetica, sans-serif;
    }

    /* GAME */
    #game {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        background: #111;
        z-index: 1;
    }

    /* COMMAND BAR */
    #commandBar {
        position: fixed;
        top: 15px;
        left: 15px;

        width: 360px;
        height: 46px;

        display: flex;
        align-items: center;
        gap: 7px;

        padding: 6px 8px;

        background: rgba(15, 15, 15, 0.94);
        border: 1px solid rgba(255,255,255,0.15);
        border-radius: 10px;

        box-shadow: 0 5px 25px rgba(0,0,0,0.45);

        z-index: 1000;

        user-select: none;
    }

    /* DRAG HANDLE */
    #dragHandle {
        width: 22px;
        height: 32px;

        display: flex;
        align-items: center;
        justify-content: center;

        color: #888;

        cursor: grab;

        font-size: 16px;
        letter-spacing: -3px;
    }

    #dragHandle:active {
        cursor: grabbing;
    }

    #commandInput {
        flex: 1;
        min-width: 0;

        height: 32px;

        padding: 0 10px;

        border: 0;
        outline: none;
        border-radius: 6px;

        background: #252525;
        color: white;

        font-size: 14px;

        user-select: text;
    }

    #commandInput::placeholder {
        color: #888;
    }

    #commandButton {
        height: 32px;

        padding: 0 13px;

        border: 0;
        border-radius: 6px;

        background: #3b3b3b;
        color: white;

        cursor: pointer;
    }

    #commandButton:hover {
        background: #505050;
    }

    /* SHOBOKLO MENU */
    #menu {
        position: fixed;

        top: 70px;
        right: 20px;

        width: 290px;
        max-height: calc(100vh - 100px);

        overflow-y: auto;

        background: rgba(18,18,18,0.97);
        color: white;

        border: 1px solid rgba(255,255,255,0.15);
        border-radius: 12px;

        box-shadow: 0 10px 35px rgba(0,0,0,0.6);

        z-index: 2000;

        display: none;
    }

    #menuHeader {
        display: flex;
        align-items: center;
        justify-content: space-between;

        padding: 12px 14px;

        background: #242424;

        border-radius: 12px 12px 0 0;

        cursor: move;

        user-select: none;
    }

    #menuTitle {
        font-weight: bold;
        font-size: 15px;
    }

    #closeMenu {
        width: 28px;
        height: 28px;

        border: 0;
        border-radius: 6px;

        background: #3a3a3a;
        color: white;

        cursor: pointer;

        font-size: 18px;
    }

    #closeMenu:hover {
        background: #555;
    }

    #menuContent {
        padding: 10px;
    }

    .cheat {
        display: flex;
        align-items: center;
        justify-content: space-between;

        gap: 10px;

        padding: 9px 8px;

        border-bottom: 1px solid rgba(255,255,255,0.07);

        font-size: 13px;
    }

    .cheat:last-child {
        border-bottom: 0;
    }

    .switch {
        position: relative;
        width: 40px;
        height: 22px;
        flex-shrink: 0;
    }

    .switch input {
        opacity: 0;
        width: 0;
        height: 0;
    }

    .slider {
        position: absolute;
        inset: 0;

        background: #444;

        border-radius: 20px;

        cursor: pointer;

        transition: 0.2s;
    }

    .slider:before {
        content: "";

        position: absolute;

        width: 16px;
        height: 16px;

        left: 3px;
        top: 3px;

        background: white;

        border-radius: 50%;

        transition: 0.2s;
    }

    .switch input:checked + .slider {
        background: #28a745;
    }

    .switch input:checked + .slider:before {
        transform: translateX(18px);
    }

    /* REOPEN BUTTON */
    #reopenButton {
        position: fixed;

        right: 18px;
        bottom: 18px;

        padding: 9px 13px;

        border: 0;
        border-radius: 8px;

        background: rgba(20,20,20,0.95);
        color: white;

        cursor: pointer;

        z-index: 1500;

        display: none;

        box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }

    #reopenButton:hover {
        background: #333;
    }

    @media (max-width: 600px) {
        #commandBar {
            width: calc(100% - 30px);
        }

        #menu {
            top: 70px;
            right: 10px;
            width: calc(100% - 20px);
        }
    }
</style>
</head>

<body>

<!-- RETROGAMES -->
<iframe
    id="game"
    src="https://www.retrogames.cc/embed/44042-sonic-cd-plus-plus-jp.html"
    width="100%"
    height="100%"
    frameborder="0"
    allowfullscreen="true"
    webkitallowfullscreen="true"
    mozallowfullscreen="true"
    scrolling="no"
    allow="cross-origin-isolated">
</iframe>


<!-- COMMAND BAR -->
<div id="commandBar">

    <div id="dragHandle" title="Drag command bar">
        ⋮⋮
    </div>

    <input
        id="commandInput"
        type="text"
        autocomplete="off"
        spellcheck="false"
        placeholder="Enter command..."
    >

    <button id="commandButton">
        Run
    </button>

</div>


<!-- SHOBOKLO MENU -->
<div id="menu">

    <div id="menuHeader">
        <span id="menuTitle">Shoboklo's Menu</span>
        <button id="closeMenu">×</button>
    </div>

    <div id="menuContent">

        <div class="cheat">
            <span>Debug Mode</span>
            <label class="switch">
                <input type="checkbox">
                <span class="slider"></span>
            </label>
        </div>

        <div class="cheat">
            <span>Invincibility</span>
            <label class="switch">
                <input type="checkbox">
                <span class="slider"></span>
            </label>
        </div>

        <div class="cheat">
            <span>Super Sonic</span>
            <label class="switch">
                <input type="checkbox">
                <span class="slider"></span>
            </label>
        </div>

        <div class="cheat">
            <span>Infinite Rings</span>
            <label class="switch">
                <input type="checkbox">
                <span class="slider"></span>
            </label>
        </div>

        <div class="cheat">
            <span>Infinite Lives</span>
            <label class="switch">
                <input type="checkbox">
                <span class="slider"></span>
            </label>
        </div>

        <div class="cheat">
            <span>Infinite Time</span>
            <label class="switch">
                <input type="checkbox">
                <span class="slider"></span>
            </label>
        </div>

        <div class="cheat">
            <span>Speed Boost</span>
            <label class="switch">
                <input type="checkbox">
                <span class="slider"></span>
            </label>
        </div>

        <div class="cheat">
            <span>Moon Jump</span>
            <label class="switch">
                <input type="checkbox">
                <span class="slider"></span>
            </label>
        </div>

        <div class="cheat">
            <span>Super Jump</span>
            <label class="switch">
                <input type="checkbox">
                <span class="slider"></span>
            </label>
        </div>

        <div class="cheat">
            <span>Freeze Timer</span>
            <label class="switch">
                <input type="checkbox">
                <span class="slider"></span>
            </label>
        </div>

        <div class="cheat">
            <span>No Enemy Damage</span>
            <label class="switch">
                <input type="checkbox">
                <span class="slider"></span>
            </label>
        </div>

        <div class="cheat">
            <span>Fast Spin Dash</span>
            <label class="switch">
                <input type="checkbox">
                <span class="slider"></span>
            </label>
        </div>

        <div class="cheat">
            <span>Low Gravity</span>
            <label class="switch">
                <input type="checkbox">
                <span class="slider"></span>
            </label>
        </div>

        <div class="cheat">
            <span>Slow Motion</span>
            <label class="switch">
                <input type="checkbox">
                <span class="slider"></span>
            </label>
        </div>

        <div class="cheat">
            <span>High Speed Mode</span>
            <label class="switch">
                <input type="checkbox">
                <span class="slider"></span>
            </label>
        </div>

        <div class="cheat">
            <span>Extra Rings</span>
            <label class="switch">
                <input type="checkbox">
                <span class="slider"></span>
            </label>
        </div>

        <div class="cheat">
            <span>Auto Spin</span>
            <label class="switch">
                <input type="checkbox">
                <span class="slider"></span>
            </label>
        </div>

        <div class="cheat">
            <span>Chaos Mode</span>
            <label class="switch">
                <input type="checkbox">
                <span class="slider"></span>
            </label>
        </div>

    </div>
</div>


<!-- REOPEN BUTTON -->
<button id="reopenButton">
    Shoboklo's Menu
</button>


<script>

/* =========================
   COMMAND SYSTEM
========================= */

const commandInput = document.getElementById("commandInput");
const commandButton = document.getElementById("commandButton");

const menu = document.getElementById("menu");
const closeMenu = document.getElementById("closeMenu");
const reopenButton = document.getElementById("reopenButton");

let menuUnlocked = false;


function runCommand() {

    const command = commandInput.value.trim().toLowerCase();

    if (!command) return;

    if (command === "/shoboklo") {

        menuUnlocked = true;

        menu.style.display = "block";
        reopenButton.style.display = "none";

        commandInput.value = "";

        return;
    }

    if (command === "/help") {

        commandInput.value = "/Shoboklo";

        return;
    }

    if (command === "/clear") {

        commandInput.value = "";

        return;
    }

    commandInput.value = "";
}


commandButton.addEventListener("click", runCommand);

commandInput.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
        runCommand();
    }

});


/* =========================
   MENU CLOSE / REOPEN
========================= */

closeMenu.addEventListener("click", function() {

    menu.style.display = "none";

    if (menuUnlocked) {
        reopenButton.style.display = "block";
    }

});


reopenButton.addEventListener("click", function() {

    menu.style.display = "block";
    reopenButton.style.display = "none";

});


/* =========================
   DRAG COMMAND BAR
========================= */

const commandBar = document.getElementById("commandBar");
const dragHandle = document.getElementById("dragHandle");

let draggingCommand = false;
let commandOffsetX = 0;
let commandOffsetY = 0;


dragHandle.addEventListener("pointerdown", function(event) {

    draggingCommand = true;

    const rect = commandBar.getBoundingClientRect();

    commandOffsetX = event.clientX - rect.left;
    commandOffsetY = event.clientY - rect.top;

    dragHandle.setPointerCapture(event.pointerId);

});


dragHandle.addEventListener("pointermove", function(event) {

    if (!draggingCommand) return;

    let x = event.clientX - commandOffsetX;
    let y = event.clientY - commandOffsetY;

    const maxX = window.innerWidth - commandBar.offsetWidth;
    const maxY = window.innerHeight - commandBar.offsetHeight;

    x = Math.max(0, Math.min(x, maxX));
    y = Math.max(0, Math.min(y, maxY));

    commandBar.style.left = x + "px";
    commandBar.style.top = y + "px";

});


dragHandle.addEventListener("pointerup", function() {

    draggingCommand = false;

});


/* =========================
   DRAG SHOBOKLO MENU
========================= */

const menuHeader = document.getElementById("menuHeader");

let draggingMenu = false;
let menuOffsetX = 0;
let menuOffsetY = 0;


menuHeader.addEventListener("pointerdown", function(event) {

    if (event.target === closeMenu) return;

    draggingMenu = true;

    const rect = menu.getBoundingClientRect();

    menuOffsetX = event.clientX - rect.left;
    menuOffsetY = event.clientY - rect.top;

    menuHeader.setPointerCapture(event.pointerId);

});


menuHeader.addEventListener("pointermove", function(event) {

    if (!draggingMenu) return;

    let x = event.clientX - menuOffsetX;
    let y = event.clientY - menuOffsetY;

    const maxX = window.innerWidth - menu.offsetWidth;
    const maxY = window.innerHeight - menu.offsetHeight;

    x = Math.max(0, Math.min(x, maxX));
    y = Math.max(0, Math.min(y, maxY));

    menu.style.left = x + "px";
    menu.style.top = y + "px";
    menu.style.right = "auto";

});


menuHeader.addEventListener("pointerup", function() {

    draggingMenu = false;

});


/* =========================
   CHEAT SWITCHES
========================= */

document.querySelectorAll(".cheat input").forEach(function(toggle) {

    toggle.addEventListener("change", function() {

        const name =
            this.closest(".cheat")
            .querySelector("span")
            .textContent;

        console.log(
            name + ": " + (this.checked ? "ON" : "OFF")
        );

    });

});

</script>

</body>
</html>
