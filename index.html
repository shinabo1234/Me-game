<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shoboklo's Sonic CD</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #000;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

/* GAME */

#game {
    position: fixed;
    inset: 0;
}

#game iframe {
    width: 100%;
    height: 100%;
    border: none;
}


/* COMMAND BAR */

#commandBar {
    position: fixed;
    bottom: 15px;
    left: 50%;
    transform: translateX(-50%);

    width: min(500px, 90vw);

    display: flex;
    gap: 5px;

    padding: 6px;

    background: rgba(15, 15, 15, 0.94);
    border: 1px solid #444;
    border-radius: 10px;

    z-index: 9999;
}

#commandInput {
    flex: 1;

    background: transparent;
    border: none;
    outline: none;

    color: white;

    padding: 9px;
    font-size: 14px;
}

#commandInput::placeholder {
    color: #777;
}

#commandButton {
    background: #292929;
    color: white;

    border: none;
    border-radius: 7px;

    padding: 8px 13px;
    cursor: pointer;
}

#commandButton:hover {
    background: #444;
}


/* REOPEN BUTTON
   Hidden until /Shoboklo is entered
*/

#reopenButton {
    position: fixed;

    top: 15px;
    right: 15px;

    background: rgba(20, 20, 20, 0.95);
    color: white;

    border: 1px solid #555;
    border-radius: 9px;

    padding: 10px 14px;

    cursor: pointer;

    z-index: 9998;

    display: none;
}

#reopenButton:hover {
    background: #333;
}


/* CHEAT MENU */

#cheatMenu {
    position: fixed;

    top: 70px;
    right: 20px;

    width: 310px;
    max-width: 90vw;

    background: rgba(20, 20, 20, 0.97);

    border: 1px solid #555;
    border-radius: 12px;

    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.75);

    z-index: 10000;

    display: none;
}


/* MENU HEADER */

#cheatHeader {
    display: flex;

    align-items: center;
    justify-content: space-between;

    padding: 13px;

    background: #292929;

    border-radius: 12px 12px 0 0;

    cursor: move;
    user-select: none;
}

#cheatHeader strong {
    font-size: 15px;
}

#closeMenu {
    background: transparent;
    border: none;

    color: #aaa;

    font-size: 22px;

    cursor: pointer;
}

#closeMenu:hover {
    color: white;
}


/* CHEATS */

#cheats {
    padding: 12px;

    max-height: 65vh;
    overflow-y: auto;
}

.cheat {
    display: flex;

    align-items: center;
    justify-content: space-between;

    padding: 10px;
    margin-bottom: 7px;

    background: #181818;
    border-radius: 8px;
}

.cheat span {
    font-size: 13px;
}


/* SWITCHES */

.switch {
    position: relative;

    width: 40px;
    height: 22px;
}

.switch input {
    opacity: 0;

    width: 0;
    height: 0;
}

.slider {
    position: absolute;

    inset: 0;

    background: #444;

    border-radius: 20px;

    cursor: pointer;

    transition: 0.2s;
}

.slider:before {
    content: "";

    position: absolute;

    width: 16px;
    height: 16px;

    left: 3px;
    top: 3px;

    background: white;

    border-radius: 50%;

    transition: 0.2s;
}

.switch input:checked + .slider {
    background: #1f8cff;
}

.switch input:checked + .slider:before {
    transform: translateX(18px);
}


/* MESSAGE */

#message {
    position: fixed;

    top: 20px;
    left: 50%;

    transform: translateX(-50%);

    background: rgba(20, 20, 20, 0.95);

    padding: 10px 18px;

    border-radius: 8px;

    display: none;

    z-index: 11000;

    font-size: 14px;
}
</style>
</head>

<body>

<!-- GAME -->

<div id="game">

    <iframe
        src="https://www.retrogames.cc/embed/44042-sonic-cd-plus-plus-jp.html"
        allowfullscreen>
    </iframe>

</div>


<!-- COMMAND BAR -->

<div id="commandBar">

    <input
        id="commandInput"
        type="text"
        placeholder="Type a command..."
        autocomplete="off"
    >

    <button id="commandButton">
        Run
    </button>

</div>


<!-- REOPEN BUTTON -->

<button id="reopenButton">
    Shoboklo's Menu
</button>


<!-- MESSAGE -->

<div id="message"></div>


<!-- CHEAT MENU -->

<div id="cheatMenu">

    <div id="cheatHeader">

        <strong>⚡ Shoboklo's Menu</strong>

        <button id="closeMenu">×</button>

    </div>

    <div id="cheats">

        <div class="cheat">
            <span>Debug Mode</span>
            <label class="switch">
                <input type="checkbox">
                <span class="slider"></span>
            </label>
        </div>

        <div class="cheat">
            <span>Invincibility</span>
            <label class="switch">
                <input type="checkbox">
                <span class="slider"></span>
            </label>
        </div>

        <div class="cheat">
            <span>Super Sonic</span>
            <label class="switch">
                <input type="checkbox">
                <span class="slider"></span>
            </label>
        </div>

        <div class="cheat">
            <span>Infinite Rings</span>
            <label class="switch">
                <input type="checkbox">
                <span class="slider"></span>
            </label>
        </div>

        <div class="cheat">
            <span>Infinite Lives</span>
            <label class="switch">
                <input type="checkbox">
                <span class="slider"></span>
            </label>
        </div>

        <div class="cheat">
            <span>Infinite Time</span>
            <label class="switch">
                <input type="checkbox">
                <span class="slider"></span>
            </label>
        </div>

        <div class="cheat">
            <span>Speed Boost</span>
            <label class="switch">
                <input type="checkbox">
                <span class="slider"></span>
            </label>
        </div>

        <div class="cheat">
            <span>Moon Jump</span>
            <label class="switch">
                <input type="checkbox">
                <span class="slider"></span>
            </label>
        </div>

        <div class="cheat">
            <span>Super Jump</span>
            <label class="switch">
                <input type="checkbox">
                <span class="slider"></span>
            </label>
        </div>

        <div class="cheat">
            <span>Freeze Timer</span>
            <label class="switch">
                <input type="checkbox">
                <span class="slider"></span>
            </label>
        </div>

        <div class="cheat">
            <span>No Enemy Damage</span>
            <label class="switch">
                <input type="checkbox">
                <span class="slider"></span>
            </label>
        </div>

        <div class="cheat">
            <span>Fast Spin Dash</span>
            <label class="switch">
                <input type="checkbox">
                <span class="slider"></span>
            </label>
        </div>

        <div class="cheat">
            <span>Low Gravity</span>
            <label class="switch">
                <input type="checkbox">
                <span class="slider"></span>
            </label>
        </div>

        <div class="cheat">
            <span>Slow Motion</span>
            <label class="switch">
                <input type="checkbox">
                <span class="slider"></span>
            </label>
        </div>

        <div class="cheat">
            <span>High Speed Mode</span>
            <label class="switch">
                <input type="checkbox">
                <span class="slider"></span>
            </label>
        </div>

        <div class="cheat">
            <span>Extra Rings</span>
            <label class="switch">
                <input type="checkbox">
                <span class="slider"></span>
            </label>
        </div>

        <div class="cheat">
            <span>Auto Spin</span>
            <label class="switch">
                <input type="checkbox">
                <span class="slider"></span>
            </label>
        </div>

        <div class="cheat">
            <span>Chaos Mode</span>
            <label class="switch">
                <input type="checkbox">
                <span class="slider"></span>
            </label>
        </div>

    </div>
</div>


<script>

/* ELEMENTS */

const input = document.getElementById("commandInput");
const commandButton = document.getElementById("commandButton");

const menu = document.getElementById("cheatMenu");
const closeButton = document.getElementById("closeMenu");
const reopenButton = document.getElementById("reopenButton");

const message = document.getElementById("message");


/* MESSAGE */

function showMessage(text) {

    message.textContent = text;
    message.style.display = "block";

    setTimeout(() => {
        message.style.display = "none";
    }, 1800);
}


/* OPEN MENU */

function openMenu() {

    menu.style.display = "block";

    /* Only becomes visible after /Shoboklo */
    reopenButton.style.display = "block";
}


/* CLOSE MENU */

function closeMenu() {

    menu.style.display = "none";

    /* Keep the reopen button available */
    reopenButton.style.display = "block";
}


/* COMMAND SYSTEM */

function runCommand() {

    const command =
        input.value.trim().toLowerCase();

    if (!command) return;


    if (command === "/shoboklo") {

        openMenu();

        showMessage(
            "Shoboklo's Menu opened!"
        );

    }

    else if (command === "/help") {

        showMessage(
            "/Shoboklo = open Shoboklo's Menu"
        );

    }

    else if (command === "/clear") {

        input.value = "";

        return;

    }

    else {

        showMessage(
            "Unknown command."
        );

    }

    input.value = "";
}


/* RUN BUTTON */

commandButton.addEventListener(
    "click",
    runCommand
);


/* ENTER */

input.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {
            runCommand();
        }

    }
);


/* CLOSE */

closeButton.addEventListener(
    "click",
    closeMenu
);


/* REOPEN */

reopenButton.addEventListener(
    "click",
    openMenu
);


/* CHEAT SWITCHES */

document
.querySelectorAll(".cheat input")
.forEach(toggle => {

    toggle.addEventListener(
        "change",
        function() {

            const name =
                this.closest(".cheat")
                .querySelector("span")
                .textContent;

            if (this.checked) {

                showMessage(
                    name + " enabled"
                );

            } else {

                showMessage(
                    name + " disabled"
                );

            }

        }
    );

});


/* DRAG MENU */

const header =
    document.getElementById("cheatHeader");

let dragging = false;
let offsetX = 0;
let offsetY = 0;


header.addEventListener(
    "pointerdown",
    function(event) {

        dragging = true;

        const rect =
            menu.getBoundingClientRect();

        offsetX =
            event.clientX - rect.left;

        offsetY =
            event.clientY - rect.top;

        header.setPointerCapture(
            event.pointerId
        );
    }
);


header.addEventListener(
    "pointermove",
    function(event) {

        if (!dragging) return;

        let x =
            event.clientX - offsetX;

        let y =
            event.clientY - offsetY;


        const maxX =
            window.innerWidth -
            menu.offsetWidth;

        const maxY =
            window.innerHeight -
            menu.offsetHeight;


        x = Math.max(
            0,
            Math.min(x, maxX)
        );

        y = Math.max(
            0,
            Math.min(y, maxY)
        );


        menu.style.left = x + "px";
        menu.style.top = y + "px";
        menu.style.right = "auto";
    }
);


header.addEventListener(
    "pointerup",
    function() {
        dragging = false;
    }
);

</script>

</body>
</html>
